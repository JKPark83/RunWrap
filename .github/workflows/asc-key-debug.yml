name: ASC key debug (temporary)
on:
  push:
    branches: [chore/asc-key-debug]
env:
  XCODEGEN_VERSION: 2.45.4
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Xcode 목록·버전
        run: ls /Applications | grep -i xcode; xcodebuild -version; sw_vers
      - name: 키 파일 작성 + 형식 점검 (값은 출력하지 않음)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          F=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "bytes=$(wc -c < $F) lines=$(wc -l < $F) CR=$(grep -c $'\r' $F || true)"
          openssl pkey -in "$F" -noout -text 2>&1 | grep -E 'Private-Key|ASN1 OID|NIST' || echo "openssl parse failed"
      - name: altool로 키 검증
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --list-providers --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | sed 's/'"$ASC_ISSUER_ID"'/***/g' | head -20 || true
      - name: xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          cd ios && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: 배포 인증서 설치
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          DIST_CERT_PASSWORD2: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          PW="${DIST_CERT_PASSWORD:-$DIST_CERT_PASSWORD2}"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning build.keychain
      - name: 번들 ID capability 점검 (App Group 배정 여부)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip install --quiet "pyjwt[crypto]"
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          key = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(p):
              try:
                  with urllib.request.urlopen(urllib.request.Request("https://api.appstoreconnect.apple.com/v1"+p, headers={"Authorization":"Bearer "+tok})) as r: return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          st, b = get("/bundleIds?limit=200")
          for x in b["data"]:
              if x["attributes"]["identifier"].startswith("com.jkpark.runwrap"):
                  st, caps = get(f"/bundleIds/{x['id']}/bundleIdCapabilities")
                  print(x["attributes"]["identifier"], x["id"])
                  for c in caps["data"]:
                      print("   ", c["attributes"]["capabilityType"], json.dumps(c["attributes"].get("settings"))[:300])
          print("appGroups endpoint:", get("/appGroups?limit=5")[0])
          PY
      - name: REST로 배포 프로파일 생성·설치
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_IDS: com.jkpark.runwrap,com.jkpark.runwrap.widget
        run: |
          pip install --quiet "pyjwt[crypto]"
          export ASC_KEY_P8_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          export DIST_CERT_SHA1=$(security find-certificate -c "Apple Distribution" -Z build.keychain | awk '/SHA-1/ {print $NF}')
          echo "cert sha1: $DIST_CERT_SHA1"
          python3 tools/ci/asc_profiles.py
      - name: 아카이브 (수동 서명)
        run: |
          xcodebuild archive -project ios/RunWrap.xcodeproj -scheme RunWrap \
            -destination generic/platform=iOS -archivePath build/RunWrap.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER='RunWrap CI AppStore $(PRODUCT_BUNDLE_IDENTIFIER)' \
            DEVELOPMENT_TEAM=WDNVP9B8A9 2>&1 | grep -E 'error:|warning:|Signing Identity|Provisioning Profile|ARCHIVE' | head -40
          test -d build/RunWrap.xcarchive
      - name: .ipa 내보내기 (수동 서명, 업로드 안 함)
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>WDNVP9B8A9</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jkpark.runwrap</key><string>RunWrap CI AppStore com.jkpark.runwrap</string>
              <key>com.jkpark.runwrap.widget</key><string>RunWrap CI AppStore com.jkpark.runwrap.widget</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/RunWrap.xcarchive -exportPath build/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist 2>&1 | grep -E 'error:|warning:|EXPORT' | head -20
          ls -la build/ipa
