# 에어코리아 측정소 목록 월간 갱신 배치 (이슈 #8)
#
# 매월 1일 새벽 측정소 정보 API(data.go.kr 15073877)로 전국 측정소 좌표를 받아
# ios/RunWrap/AirStations.json을 갱신한다 — 신설·폐쇄 반영. 앱은 번들 사본만 쓴다.
# generatedAt은 매번 바뀌므로 stations 내용이 같으면 커밋하지 않는다 (race-info와 같은 정책).
#
# 필요한 리포지토리 시크릿: DATA_GO_KR_KEY — data.go.kr 일반 인증키(Decoding) 원본.
# 시크릿이 없으면 갱신을 건너뛴다(실패 아님) — 키 발급 전에도 다른 CI가 막히지 않는다.
name: air-stations

on:
  schedule:
    - cron: "30 20 1 * *"   # 매월 1일 05:30 KST (UTC 전날 20:30)
  workflow_dispatch: {}      # 수동 실행용 — 키 등록 직후 첫 채움에 쓴다

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 측정소 목록 수집 → AirStations.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "DATA_GO_KR_KEY 시크릿 없음 — 갱신 생략"
            exit 0
          fi
          python3 tools/air-quality/fetch_stations.py -o ios/RunWrap/AirStations.json

      - name: 측정소가 바뀌었을 때만 커밋
        run: |
          if python3 - <<'EOF'
          import json, subprocess, sys
          shown = subprocess.run(["git", "show", "HEAD:ios/RunWrap/AirStations.json"],
                                 capture_output=True, text=True).stdout
          old = json.loads(shown) if shown else {"stations": []}
          new = json.load(open("ios/RunWrap/AirStations.json"))
          sys.exit(0 if old.get("stations") == new["stations"] else 1)
          EOF
          then
            echo "측정소 변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ios/RunWrap/AirStations.json
            git commit -m "chore: 측정소 목록 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
