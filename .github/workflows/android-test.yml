# Android 테스트 + iOS ↔ Android 동기화 점검
#
# dev·main으로 가는 PR과 dev push마다:
#   1. tools/ci/parity_check.py — iOS(사양 원본)와 Android(이식본)의 파일·테스트 이름 대응,
#      PR이면 "iOS만 고치고 Android는 그대로"인 변경까지 잡는다 (docs/parity.md 참고)
#   2. :engine 테스트를 UTC·Asia/Seoul 두 시간대로 (iOS 테스트가 로컬 KST·CI UTC 양쪽에서 통과하는 것과 같은 조건)
#   3. :app 유닛 테스트 + 디버그 빌드
# 시크릿이 필요 없다 — 지도·대기질 키가 없으면 해당 기능만 빈 상태로 빌드된다(포크 PR에서도 돈다).
name: android-test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # parity_check --diff가 기준 브랜치와 비교한다

      - name: iOS ↔ Android 대응 점검
        run: python3 tools/ci/parity_check.py

      - name: iOS만 바뀐 변경 점검 (PR)
        if: github.event_name == 'pull_request'
        run: python3 tools/ci/parity_check.py --diff "origin/${{ github.base_ref }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 엔진 테스트 (UTC) + 앱 테스트·빌드
        run: cd android && ./gradlew :engine:test :app:testDebugUnitTest :app:assembleDebug

      - name: 엔진 테스트 (Asia/Seoul)
        run: cd android && ./gradlew :engine:test -PtestZone=Asia/Seoul
