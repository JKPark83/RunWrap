name: RunWrap
options:
  bundleIdPrefix: com.jkpark
  deploymentTarget:
    iOS: "17.0"   # SwiftData(2단계 이후 리포트 캐시) 기준. 기획서 §11 참조
settings:
  base:
    # 버전은 프로젝트 레벨 한 곳에만 둔다 — 앱과 위젯 확장(이슈 #181)의 CFBundleShortVersionString·
    # CFBundleVersion이 같아야 업로드가 통과하고, bump-dev-version.yml은 첫 MARKETING_VERSION만 고친다
    MARKETING_VERSION: "1.5"            # 사용자에게 보이는 버전의 최소 희망값 — 트레인 마감 시 CI(testflight.yml)가 패치 자동 인상
    CURRENT_PROJECT_VERSION: "4"        # 빌드 번호 기본값 — CI(testflight.yml)는 ASC 최신 +1로 덮어쓴다
targets:
  RunWrap:
    type: application
    platform: iOS
    sources:
      - RunWrap
      # 디스플레이 서체 2종 — 시안 v0.4. 둘 다 SIL OFL 1.1이라 라이선스 전문을 동봉한다.
      # Black Han Sans: 화면 대제목(한글), Anton: 큰 숫자(거리·체감온도 등 라틴 숫자 전용)
      - path: RunWrap/BlackHanSans-Regular.ttf
        buildPhase: resources
      - path: RunWrap/BlackHanSans-OFL.txt
        buildPhase: resources
      - path: RunWrap/Anton-Regular.ttf
        buildPhase: resources
      - path: RunWrap/Anton-OFL.txt
        buildPhase: resources
    entitlements:
      path: RunWrap/RunWrap.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true   # 러닝 종료 감지 (계획서 M8)
        # 성장 진행도 백업·복원 — 개인 CloudKit DB에 스냅샷 1건만 저장한다 (이슈 #29)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jkpark.runwrap
        com.apple.security.application-groups: [group.com.jkpark.runwrap]   # 위젯 스냅샷 공유 (이슈 #181)
    info:
      path: RunWrap/Info.plist
      properties:
        # 런치 스크린 = 스플래시(SplashScreen.swift)와 같은 배경색 + 중앙 아이콘 —
        # 프로세스 기동 중 흰 화면 대신 첫 프레임부터 브랜드 화면이 보이게 한다
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        CFBundleDisplayName: 런미새
        UIAppFonts: [BlackHanSans-Regular.ttf, Anton-Regular.ttf]   # 시안 v0.4 디스플레이 서체 (RR.display / RR.numeral)
        # 버전은 프로젝트 레벨 settings의 MARKETING_VERSION·CURRENT_PROJECT_VERSION에서 주입한다 —
        # App Store Connect는 같은 빌드 번호를 두 번 받지 않으므로 업로드마다 후자를 올린다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]   # 아이폰 세로 전용
        ITSAppUsesNonExemptEncryption: false   # HTTPS만 사용 — 수출 규정 면제 (제출 시 질문 생략)
        NSHealthShareUsageDescription: 애플워치로 기록한 러닝(거리·시간·경로·심박·걸음 수·칼로리·VO₂max·러닝 폼), 최근 2주의 다른 운동 기록, 회복 신호(수면·심박 변이·안정 심박·심박 회복·호흡수·수면 중 손목 온도), 최대 심박 추정에 쓸 생년월일을 읽어 리포트와 체력 배터리를 만들기 위해 사용합니다. 건강 데이터는 기기 밖으로 나가지 않습니다.
        # 이 앱은 건강 데이터를 쓰지 않는다(requestAuthorization은 전부 toShare: []).
        # 그래도 HealthKit 엔타이틀먼트가 있으면 App Store 업로드 검증이 이 키를 요구한다(오류 90683)
        NSHealthUpdateUsageDescription: 이 앱은 건강 데이터를 읽기만 합니다. 건강 앱에 어떤 데이터도 쓰거나 추가하지 않습니다.
        NSPhotoLibraryAddUsageDescription: 만든 러닝 스토리 카드를 사진 앱에 저장하기 위해 사용합니다.
        NSCameraUsageDescription: 완주증을 촬영해 대회 기록(종목·기록·날짜)을 읽어 입력 폼을 채우기 위해 사용합니다. 사진은 기기에서만 처리하고 저장하지 않습니다.   # 설정 > 대회 기록 추가 '촬영' (이슈 #192)
        NSLocationWhenInUseUsageDescription: 현재 위치의 날씨·대기질로 러닝 복장을 추천하고, 근처의 급수대·화장실·편의점을 찾기 위해 사용합니다. 날씨 조회에는 약 1km 단위로 뭉갠 좌표만 보내고, 대기질은 기기에서 고른 가까운 측정소 이름으로만 조회합니다. 위치 좌표는 저장하지 않습니다.
        NSCalendarsWriteOnlyAccessUsageDescription: 관심 대회의 날짜를 캘린더에 이벤트로 추가하기 위해서만 사용합니다. 기존 일정은 읽지 않습니다.   # 대회 상세 '캘린더에 추가' (이슈 #172)
        NSLocationTemporaryUsageDescriptionDictionary:   # '정확한 위치'가 꺼진 사용자에게 코스 탭이 일회성 정밀 위치를 청할 때의 문구 (이슈 #74)
          NearbySupply: 근처 급수대·화장실·편의점까지의 거리를 정확히 짚기 위해 이번만 정확한 위치를 씁니다. 좌표는 저장하지 않습니다.
        UTImportedTypeDeclarations:   # 코스 탭 GPX 업로드 — fileImporter의 UTType(importedAs:)와 짝 (계획서 M12-3)
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX 경로 파일
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9        # Apple Developer Program 유료 팀 (JinKon Park)
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.runwrap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # 아이폰 전용 (아이패드 방향 요건 회피)
    dependencies:
      - target: RunWrapWidget   # 홈·잠금화면 위젯 확장 — xcodegen이 앱에 임베드한다 (이슈 #181)
    scheme:
      testTargets: [RunWrapTests]
  # 홈·잠금화면 위젯 (이슈 #181) — HealthKit을 읽지 않고 앱이 App Group에 남긴 스냅샷만 그린다
  RunWrapWidget:
    type: app-extension
    platform: iOS
    sources:
      - RunWrapWidget
      - path: RunWrap/Theme.swift             # RR 토큰·RRTone·Format·폰트 — 앱과 같은 디자인 시스템
      - path: RunWrap/WidgetSnapshot.swift
      - path: RunWrap/WidgetSnapshotStore.swift
      - path: RunWrap/BlackHanSans-Regular.ttf   # RR.display / RR.numeral 이 참조하는 서체 (앱과 같은 2종)
        buildPhase: resources
      - path: RunWrap/Anton-Regular.ttf
        buildPhase: resources
    entitlements:
      path: RunWrapWidget/RunWrapWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jkpark.runwrap]   # 앱이 쓴 스냅샷 읽기 (이슈 #181)
    info:
      path: RunWrapWidget/Info.plist
      properties:
        CFBundleDisplayName: 런미새
        CFBundleShortVersionString: $(MARKETING_VERSION)   # 확장 버전은 앱과 같아야 업로드가 통과한다 — CI가 같은 값을 모든 타깃에 주입
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [BlackHanSans-Regular.ttf, Anton-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.runwrap.widget
        TARGETED_DEVICE_FAMILY: "1"
  RunWrapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunWrapTests]
    dependencies:
      - target: RunWrap
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9
        GENERATE_INFOPLIST_FILE: YES
