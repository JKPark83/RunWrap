name: RunWrap
options:
  bundleIdPrefix: com.jkpark
  deploymentTarget:
    iOS: "17.0"   # SwiftData(2단계 이후 리포트 캐시) 기준. 기획서 §11 참조
targets:
  RunWrap:
    type: application
    platform: iOS
    sources:
      - RunWrap
      # 디스플레이 서체 2종 — 시안 v0.4. 둘 다 SIL OFL 1.1이라 라이선스 전문을 동봉한다.
      # Black Han Sans: 화면 대제목(한글), Anton: 큰 숫자(거리·체감온도 등 라틴 숫자 전용)
      - path: RunWrap/BlackHanSans-Regular.ttf
        buildPhase: resources
      - path: RunWrap/BlackHanSans-OFL.txt
        buildPhase: resources
      - path: RunWrap/Anton-Regular.ttf
        buildPhase: resources
      - path: RunWrap/Anton-OFL.txt
        buildPhase: resources
    entitlements:
      path: RunWrap/RunWrap.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true   # 러닝 종료 감지 (계획서 M8)
        # 성장 진행도 백업·복원 — 개인 CloudKit DB에 스냅샷 1건만 저장한다 (이슈 #29)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jkpark.runwrap
    info:
      path: RunWrap/Info.plist
      properties:
        # 런치 스크린 = 스플래시(SplashScreen.swift)와 같은 배경색 + 중앙 아이콘 —
        # 프로세스 기동 중 흰 화면 대신 첫 프레임부터 브랜드 화면이 보이게 한다
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        CFBundleDisplayName: 런미새
        UIAppFonts: [BlackHanSans-Regular.ttf, Anton-Regular.ttf]   # 시안 v0.4 디스플레이 서체 (RR.display / RR.numeral)
        # 버전은 아래 settings의 MARKETING_VERSION·CURRENT_PROJECT_VERSION에서 주입한다 —
        # App Store Connect는 같은 빌드 번호를 두 번 받지 않으므로 업로드마다 후자를 올린다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]   # 아이폰 세로 전용
        ITSAppUsesNonExemptEncryption: false   # HTTPS만 사용 — 수출 규정 면제 (제출 시 질문 생략)
        NSHealthShareUsageDescription: 애플워치로 기록한 러닝(거리·시간·심박)을 읽어 리포트를 만들기 위해 사용합니다. 데이터는 기기 밖으로 나가지 않습니다.
        # 이 앱은 건강 데이터를 쓰지 않는다(requestAuthorization은 전부 toShare: []).
        # 그래도 HealthKit 엔타이틀먼트가 있으면 App Store 업로드 검증이 이 키를 요구한다(오류 90683)
        NSHealthUpdateUsageDescription: 이 앱은 건강 데이터를 읽기만 합니다. 건강 앱에 어떤 데이터도 쓰거나 추가하지 않습니다.
        NSPhotoLibraryAddUsageDescription: 만든 러닝 스토리 카드를 사진 앱에 저장하기 위해 사용합니다.
        NSLocationWhenInUseUsageDescription: 현재 위치의 날씨로 러닝 복장을 추천하고, 근처의 급수대·화장실·편의점을 찾기 위해 사용합니다. 위치는 기기 안에서만 쓰고 저장하거나 전송하지 않습니다.
        UTImportedTypeDeclarations:   # 코스 탭 GPX 업로드 — fileImporter의 UTType(importedAs:)와 짝 (계획서 M12-3)
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX 경로 파일
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9        # Apple Developer Program 유료 팀 (JinKon Park)
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.runwrap
        MARKETING_VERSION: "1.2"            # 사용자에게 보이는 버전의 최소 희망값 — 트레인 마감 시 CI(testflight.yml)가 패치 자동 인상
        CURRENT_PROJECT_VERSION: "4"        # 빌드 번호 기본값 — CI(testflight.yml)는 ASC 최신 +1로 덮어쓴다
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # 아이폰 전용 (아이패드 방향 요건 회피)
    scheme:
      testTargets: [RunWrapTests]
  RunWrapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunWrapTests]
    dependencies:
      - target: RunWrap
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9
        GENERATE_INFOPLIST_FILE: YES
