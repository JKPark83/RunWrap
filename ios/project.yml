name: RunWrap
options:
  bundleIdPrefix: com.jkpark
  deploymentTarget:
    iOS: "17.0"   # SwiftData(2단계 이후 리포트 캐시) 기준. 기획서 §11 참조
targets:
  RunWrap:
    type: application
    platform: iOS
    sources: [RunWrap]
    entitlements:
      path: RunWrap/RunWrap.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true   # 러닝 종료 감지 (계획서 M8)
    info:
      path: RunWrap/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: RunWrap
        NSHealthShareUsageDescription: 애플워치로 기록한 러닝(거리·시간·심박)을 읽어 리포트를 만들기 위해 사용합니다. 데이터는 기기 밖으로 나가지 않습니다.
        NSPhotoLibraryAddUsageDescription: 만든 러닝 스토리 카드를 사진 앱에 저장하기 위해 사용합니다.
        NSLocationWhenInUseUsageDescription: 현재 위치의 날씨로 러닝 복장을 추천하기 위해 사용합니다. 위치는 날씨 조회에만 쓰고 저장하지 않습니다.
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9        # 무료 팀 (7일 서명)
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.runwrap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RunWrapTests]
  RunWrapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunWrapTests]
    dependencies:
      - target: RunWrap
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9
        GENERATE_INFOPLIST_FILE: YES
