name: RunWrap
options:
  bundleIdPrefix: com.jkpark
  deploymentTarget:
    iOS: "17.0"   # SwiftData(2단계 이후 리포트 캐시) 기준. 기획서 §11 참조
targets:
  RunWrap:
    type: application
    platform: iOS
    sources: [RunWrap]
    entitlements:
      path: RunWrap/RunWrap.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: RunWrap/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: RunWrap
        NSHealthShareUsageDescription: 애플워치로 기록한 러닝(거리·시간·심박)을 읽어 리포트를 만들기 위해 사용합니다. 데이터는 기기 밖으로 나가지 않습니다.
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9        # 무료 팀 (7일 서명)
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.runwrap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RunWrapTests]
  RunWrapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunWrapTests]
    dependencies:
      - target: RunWrap
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9
        GENERATE_INFOPLIST_FILE: YES
